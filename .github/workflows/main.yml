name: Terraform Production CI/CD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. SECURITY SCAN
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------- TFLint ----------------
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5

      - name: Initialize TFLint
        working-directory: ./parent
        run: tflint --init

      - name: Run TFLint
        working-directory: ./parent
        run: tflint

      # ---------------- tfsec ----------------
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ./parent

      # ---------------- Gitleaks ----------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 2. TERRAFORM VALIDATE + PLAN
  # ============================================================
  terraform-plan:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest

    needs:
      - security-scan

    steps:

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Azure Login using Client Secret
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # Verify Azure Account
      - name: Verify Azure Account
        run: |
          az account show \
            --query "{Subscription:id, Tenant:tenantId, Name:name}" \
            -o table

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7

      # Terraform Init
      - name: Terraform Init
        working-directory: ./parent
        run: terraform init -reconfigure

      # Terraform Validate
      - name: Terraform Validate
        working-directory: ./parent
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        working-directory: ./parent
        env:
          TF_VAR_vm_admin_password: ${{ secrets.AZURE_VM_ADMIN_PASSWORD }}
        run: |
          terraform plan \
            -refresh=false \
            -input=false \
            -no-color \
            -out=tfplan

      # Upload exact Terraform Plan for Apply
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ./parent/tfplan
          retention-days: 1


  # ============================================================
  # 3. PRODUCTION APPROVAL + APPLY
  # ============================================================
  terraform-apply:
    name: Production Apply
    runs-on: ubuntu-latest

    needs:
      - terraform-plan

    environment:
      name: production

    steps:

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # Verify Azure Account
      - name: Verify Azure Account
        run: |
          az account show \
            --query "{Subscription:id, Tenant:tenantId, Name:name}" \
            -o table

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7

      # Terraform Init
      - name: Terraform Init
        working-directory: ./parent
        run: terraform init -reconfigure

      # Download the exact plan generated by Plan job
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ./parent

      # Terraform Apply
      - name: Terraform Apply
        working-directory: ./parent
        env:
          TF_VAR_vm_admin_password: ${{ secrets.AZURE_VM_ADMIN_PASSWORD }}
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan
