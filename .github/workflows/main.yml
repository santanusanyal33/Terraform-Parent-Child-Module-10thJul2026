name: Terraform Plan - Client Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository path
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Repository root:"
          ls -la
          echo ""
          echo "Terraform directories:"
          find . -maxdepth 6 -type d | sort

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Verify Azure Account
        run: |
          az account show --query "{Subscription:id, Tenant:tenantId, Name:name}" -o table

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7

      - name: Terraform Init
        working-directory: ./Terraform/Terraform Module_10.07.2026/Terraform-Parent-Child-Module-10thJul2026/parent
        run: terraform init -reconfigure

      - name: Terraform Validate
        working-directory: ./Terraform/Terraform Module_10.07.2026/Terraform-Parent-Child-Module-10thJul2026/parent
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./Terraform/Terraform Module_10.07.2026/Terraform-Parent-Child-Module-10thJul2026/parent
        run: terraform plan
